# Included from every response-serving `location` block in nginx.conf.
#
# nginx only inherits `add_header` from a parent block when the child
# block declares none of its own. Every location in nginx.conf already
# sets its own Cache-Control via add_header, which silently drops any
# add_header set at the `server` level for that response. Using an
# explicit `include` here (instead of relying on inheritance) guarantees
# every response actually carries these headers.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# script-src stays strict (no unsafe-inline/unsafe-eval): Vue 3 SFCs are
# precompiled at build time by @vitejs/plugin-vue and the production build
# emits only external, hashed script files, so nothing here needs it.
# style-src allows unsafe-inline: a small number of components set inline
# style via Vue's `:style` binding, which browsers treat as inline CSS
# requiring either 'unsafe-inline' or a per-element nonce/hash. Inline
# style injection is a materially lower-severity XSS vector than inline
# script execution, so this is the common, defensible trade-off; tighten
# to nonces later if those bindings are removed.
# connect-src/frame-src allow the API and the Keycloak realm: API calls go
# to api.moneybeeloan.com, and oidc-client-ts's silent token renewal loads
# a hidden iframe against the Keycloak authorization endpoint before
# redirecting back to this app's own /auth/silent-callback.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.moneybeeloan.com https://auth.codestra.co; frame-src https://auth.codestra.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

name: finalize-and-clean-ui-branch

on:
  push:
    branches:
      - feature/clear-compliance-operations-ui-20260901
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-and-clean-ui-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-clean-and-report:
    if: github.repository == 'appolon1908-hue/Moneybee-frontend-'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Allow backend and frontend apply jobs to finish
        run: sleep 1200
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/clear-compliance-operations-ui-20260901
          fetch-depth: 0
      - name: Checkout backend contract authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: appolon1908-hue/Moneybee-Backend
          ref: claude/system-review-architecture-8vo66p
          path: moneybee-backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: moneybee-backend/pyproject.toml
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Assert completed frontend source
        run: |
          test -f packages/api-client/src/compliance.ts
          test -f packages/api-client/src/compliance.test.ts
          test -f apps/admin/src/views/ComplianceView.vue
          test -f scripts/apply_compliance_ui_completion.py
          test -f docs/COMPLIANCE_OPERATIONS_UI.md
          test "$(grep -Ec '^[[:space:]]*compliance:[[:space:]]*\{' packages/api-client/src/endpoints.ts)" -eq 1
          grep -q 'path: "/compliance"' apps/admin/src/router.ts
          grep -q 'formatMoney(item.amount_financed)' apps/admin/src/views/ComplianceView.vue
          ! grep -R -nE 'fetch\(|axios\.' apps/admin/src/views/ComplianceView.vue
      - name: Export and verify exact backend OpenAPI
        working-directory: moneybee-backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./final-frontend-contract.db
          AUTO_CREATE_SCHEMA: "true"
          LOCAL_AUTH_BYPASS: "true"
          LOCAL_IDENTITY_ENFORCEMENT: "false"
          FIELD_ENCRYPTION_KEYS_JSON: '{"1":"zJ8vQ3mK7pR2sT5wX9aB1cD4eF6gH0iJ2kL4mN6oP8q="}'
          FIELD_ENCRYPTION_ACTIVE_KEY_VERSION: "1"
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python scripts/export_openapi.py
          python scripts/verify_openapi_contract.py
          sha256sum openapi.json | tee /tmp/moneybee-final-backend-openapi.sha256
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract, type, test, build, and scaffold certification
        env:
          MONEYBEE_OPENAPI_FILE: ${{ github.workspace }}/moneybee-backend/openapi.json
        run: |
          set -o pipefail
          pnpm contracts:check | tee /tmp/moneybee-final-contracts.log
          pnpm typecheck | tee /tmp/moneybee-final-typecheck.log
          pnpm test | tee /tmp/moneybee-final-tests.log
          pnpm build | tee /tmp/moneybee-final-build.log
          python scripts/validate_frontend_scaffold.py | tee /tmp/moneybee-final-scaffold.log
      - name: Private-key source gate
        run: |
          python - <<'PY'
          from pathlib import Path

          markers = (
              "-----BEGIN PRIVATE KEY-----",
              "-----BEGIN RSA PRIVATE KEY-----",
              "-----BEGIN OPENSSH PRIVATE KEY-----",
              "-----BEGIN EC PRIVATE KEY-----",
          )
          ignored = {".git", "node_modules", "dist", ".pnpm-store", "moneybee-backend"}
          failures = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if any(marker in text for marker in markers):
                  failures.append(str(path))
          if failures:
              raise SystemExit("Private-key material found: " + ", ".join(failures))
          print("No private-key blocks found in frontend source.")
          PY
      - name: Refresh backend contract lock
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path = Path("docs/BACKEND_CONTRACT_LOCK.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["sha"] = subprocess.check_output(
              ["git", "-C", "moneybee-backend", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          payload["openapi_sha256"] = hashlib.sha256(
              Path("moneybee-backend/openapi.json").read_bytes()
          ).hexdigest()
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Write final source certification
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          frontend_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          backend_sha = subprocess.check_output(
              ['git', '-C', 'moneybee-backend', 'rev-parse', 'HEAD'], text=True
          ).strip()
          lock = json.loads(Path('docs/BACKEND_CONTRACT_LOCK.json').read_text(encoding='utf-8'))
          test_text = Path('/tmp/moneybee-final-tests.log').read_text(encoding='utf-8')
          test_summary = next(
              (line.strip() for line in reversed(test_text.splitlines()) if 'passed' in line.lower()),
              'frontend tests completed successfully',
          )
          report = f'''# MoneyBee frontend design and API completion report

          Generated: {datetime.now(UTC).isoformat()}

          ## Authority

          - Repository: `appolon1908-hue/Moneybee-frontend-`
          - Review branch: `feature/clear-compliance-operations-ui-20260901`
          - Validated frontend source SHA: `{frontend_sha}`
          - Backend contract SHA: `{backend_sha}`
          - Backend OpenAPI SHA-256: `{lock['openapi_sha256']}`
          - Runtime deployment: `NOT PERFORMED`

          ## Completed experience

          - Grouped MoneyBee admin navigation with a dedicated `/compliance` workspace.
          - Aggregate compliance evidence cards.
          - Commercial-financing disclosure review and authenticated acknowledgement.
          - Adverse-action notice review.
          - Permission-separated commission tax-record preparation.
          - Loading, error, empty, confirmation, and responsive states.
          - Exact two-decimal display for compliance monetary values.
          - Typed API services, encoded identifiers, and organization context.
          - No screen-level direct network calls.

          ## Canonical endpoints consumed

          - `GET /api/v2/admin/compliance/summary`
          - `GET /api/v2/admin/compliance/adverse-action-notices`
          - `GET /api/v2/admin/compliance/commercial-financing-disclosures`
          - `GET /api/v2/admin/compliance/commission-tax-records`
          - `GET /api/v2/admin/offers/{{offer_id}}/commercial-financing-disclosure`
          - `POST /api/v2/admin/offers/{{offer_id}}/commercial-financing-disclosure/acknowledge`
          - `POST /api/v2/admin/commission-tax-records/generate`
          - `PATCH /api/v2/admin/commission-tax-records/{{record_id}}/tin`

          ## Validation

          - Backend OpenAPI export and manifest verification: `PASS`
          - Frontend/backend route drift: `PASS`
          - TypeScript typecheck: `PASS`
          - Frontend tests: `{test_summary}`
          - Production builds: `PASS`
          - Frontend scaffold validation: `PASS`
          - Private-key scan: `PASS`

          ## Safety

          - The browser does not calculate authoritative fees, tax, APR, or disclosures.
          - Acknowledgement identity is supplied by backend authentication.
          - Tax data is withheld when the principal lacks the commission permission.
          - TIN values are never returned to or displayed by the compliance workspace.
          - No production deployment or live-provider activation occurred.

          ## Verdict

          `COMPLETE_AND_GREEN` for coordinated repository-source review.
          Runtime deployment remains a separate, explicitly disabled activity.
          '''
          Path('MONEYBEE_DESIGN_LOGIC_API_COMPLETION_REPORT.md').write_text(
              re.sub(r'^          ', '', report, flags=re.MULTILINE),
              encoding='utf-8',
          )
          PY
      - name: Remove temporary completion workflows
        run: |
          rm -f \
            .github/workflows/complete-compliance-ui.yml \
            .github/workflows/rerun-compliance-ui.yml \
            .github/workflows/finalize-compliance-ui.yml \
            .github/workflows/certify-ui-completion.yml \
            .github/workflows/repair-compliance-ui-pipeline.yml \
            .github/workflows/apply-compliance-ui-v2.yml \
            .github/workflows/canonicalize-compliance-ui.yml \
            .github/workflows/finalize-and-clean-ui-branch.yml
      - name: Commit final reviewed tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Final UI branch is already clean and certified."
          else
            git commit -m "chore(frontend): finalize certified review branch"
            git push origin HEAD:feature/clear-compliance-operations-ui-20260901
          fi
      - name: Update frontend pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head feature/clear-compliance-operations-ui-20260901 \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file MONEYBEE_DESIGN_LOGIC_API_COMPLETION_REPORT.md
          fi

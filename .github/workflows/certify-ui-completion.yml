name: certify-ui-completion

on:
  push:
    branches:
      - feature/clear-compliance-operations-ui-20260901
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: certify-ui-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.repository == 'appolon1908-hue/Moneybee-frontend-'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Allow backend and frontend implementation jobs to finish
        run: sleep 420
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/clear-compliance-operations-ui-20260901
          fetch-depth: 0
      - name: Checkout exact backend review contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: appolon1908-hue/Moneybee-Backend
          ref: claude/system-review-architecture-8vo66p
          path: moneybee-backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: moneybee-backend/pyproject.toml
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Assert completed UI and typed client source
        run: |
          test -f packages/api-client/src/compliance.ts
          test -f packages/api-client/src/compliance.test.ts
          test -f apps/admin/src/views/ComplianceView.vue
          test -f docs/COMPLIANCE_OPERATIONS_UI.md
          grep -q '/admin/compliance/summary' packages/api-client/src/endpoints.ts
          grep -q 'ComplianceView.vue' apps/admin/src/router.ts
          ! grep -R -nE 'fetch\(|axios\.' apps/admin/src/views/ComplianceView.vue
      - name: Export exact backend OpenAPI contract
        working-directory: moneybee-backend
        env:
          APP_ENV: test
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: sqlite+aiosqlite:///./contract-export.db
          FIELD_ENCRYPTION_KEYS_JSON: '{"1":"zJ8vQ3mK7pR2sT5wX9aB1cD4eF6gH0iJ2kL4mN6oP8q="}'
          FIELD_ENCRYPTION_ACTIVE_KEY_VERSION: "1"
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python scripts/export_openapi.py
          python scripts/verify_openapi_contract.py
          sha256sum openapi.json | tee /tmp/moneybee-backend-openapi.sha256
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: API contract, type, test, and build gates
        env:
          MONEYBEE_OPENAPI_FILE: ${{ github.workspace }}/moneybee-backend/openapi.json
        run: |
          set -o pipefail
          pnpm contracts:check | tee /tmp/moneybee-contracts.log
          pnpm typecheck | tee /tmp/moneybee-typecheck.log
          pnpm test | tee /tmp/moneybee-tests.log
          pnpm build | tee /tmp/moneybee-build.log
          python scripts/validate_frontend_scaffold.py | tee /tmp/moneybee-scaffold.log
      - name: Source and secret safety gates
        run: |
          python - <<'PY'
          from pathlib import Path

          markers = (
              '-----BEGIN PRIVATE KEY-----',
              '-----BEGIN RSA PRIVATE KEY-----',
              '-----BEGIN OPENSSH PRIVATE KEY-----',
              '-----BEGIN EC PRIVATE KEY-----',
          )
          failures = []
          ignored = {'.git', 'node_modules', 'dist', '.pnpm-store'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if any(marker in text for marker in markers):
                  failures.append(str(path))
          if failures:
              raise SystemExit('Private-key material found: ' + ', '.join(failures))
          print('No private-key blocks found in frontend source.')
          PY
      - name: Update exact backend contract lock
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('docs/BACKEND_CONTRACT_LOCK.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['sha'] = subprocess.check_output(
              ['git', '-C', 'moneybee-backend', 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          payload['openapi_sha256'] = subprocess.check_output(
              ['sha256sum', 'moneybee-backend/openapi.json'],
              text=True,
          ).split()[0]
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Write exact-head completion report
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          frontend_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          backend_sha = subprocess.check_output(
              ['git', '-C', 'moneybee-backend', 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          lock = json.loads(Path('docs/BACKEND_CONTRACT_LOCK.json').read_text(encoding='utf-8'))
          report = f'''# MoneyBee frontend design and API completion report

          Generated: {datetime.now(UTC).isoformat()}

          ## Repository authority

          - Repository: `appolon1908-hue/Moneybee-frontend-`
          - Branch: `feature/clear-compliance-operations-ui-20260901`
          - Certified frontend source SHA: `{frontend_sha}`
          - Backend contract branch: `claude/system-review-architecture-8vo66p`
          - Backend contract SHA: `{backend_sha}`
          - Backend OpenAPI SHA-256: `{lock['openapi_sha256']}`
          - Production deployment: `NOT PERFORMED`

          ## Completed experience

          - Grouped, readable MoneyBee admin navigation.
          - New `/compliance` operations workspace.
          - Aggregate compliance evidence cards.
          - Commercial-financing disclosure review and authenticated acknowledgement.
          - Adverse-action notice review.
          - Commission tax-record preparation and year filtering.
          - Loading, error, empty, confirmation, permission-aware, and responsive states.
          - Exact two-decimal display for compliance monetary values.
          - Typed API services with encoded identifiers and organization context.
          - No screen-level direct network calls.

          ## Canonical API endpoints consumed

          - `GET /api/v2/admin/compliance/summary`
          - `GET /api/v2/admin/compliance/adverse-action-notices`
          - `GET /api/v2/admin/compliance/commercial-financing-disclosures`
          - `GET /api/v2/admin/compliance/commission-tax-records`
          - `GET /api/v2/admin/offers/{{offer_id}}/commercial-financing-disclosure`
          - `POST /api/v2/admin/offers/{{offer_id}}/commercial-financing-disclosure/acknowledge`
          - `POST /api/v2/admin/commission-tax-records/generate`
          - `PATCH /api/v2/admin/commission-tax-records/{{record_id}}/tin`

          ## Validation

          - Backend OpenAPI export: `PASS`
          - Backend OpenAPI manifest verification: `PASS`
          - Frontend/backend route drift: `PASS`
          - TypeScript typecheck: `PASS`
          - Frontend tests: `PASS`
          - Production frontend builds: `PASS`
          - Frontend scaffold validation: `PASS`
          - Private-key scan: `PASS`

          ## Safety

          - The frontend does not calculate authoritative fees, tax, APR, or disclosures.
          - Acknowledgement actor identity is supplied by backend authentication, not the UI.
          - TIN values are never returned to or displayed by the operations workspace.
          - No production deployment or live-provider activation occurred.

          ## Verdict

          `COMPLETE_AND_GREEN` for coordinated repository-source review.
          Runtime deployment remains a separate, explicitly disabled activity.
          '''
          Path('MONEYBEE_DESIGN_LOGIC_API_COMPLETION_REPORT.md').write_text(
              re.sub(r'^          ', '', report, flags=re.MULTILINE),
              encoding='utf-8',
          )
          PY
      - name: Commit certified evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/BACKEND_CONTRACT_LOCK.json \
            MONEYBEE_DESIGN_LOGIC_API_COMPLETION_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(frontend): certify exact API and UI completion"
            git push origin HEAD:feature/clear-compliance-operations-ui-20260901
          fi
      - name: Update frontend pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head feature/clear-compliance-operations-ui-20260901 \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file MONEYBEE_DESIGN_LOGIC_API_COMPLETION_REPORT.md
          fi

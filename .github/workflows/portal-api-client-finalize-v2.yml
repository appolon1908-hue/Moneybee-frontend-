name: Portal API client finalization v2

on:
  push:
    branches:
      - feature/portal-api-client

permissions:
  contents: write

concurrency:
  group: portal-api-client-finalization-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portal-api-client
          fetch-depth: 0

      - name: Correct and export portal client
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("packages/api-client/src/index.ts")
          text = index.read_text()
          export = "export * from './portals'"
          if export not in text:
              index.write_text(text.rstrip() + "\n" + export + "\n")

          path = Path("packages/api-client/src/portals.ts")
          text = path.read_text()
          old = '''export function withQuery(
  path: string,
  values: Record<string, string | number | boolean | null | undefined>,
): string {
  const params = new URLSearchParams()
  for (const [key, value] of Object.entries(values)) {
'''
          new = '''export function withQuery<TValues extends object>(
  path: string,
  values: TValues,
): string {
  const params = new URLSearchParams()
  for (const [key, value] of Object.entries(
    values as Record<string, string | number | boolean | null | undefined>,
  )) {
'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install workspace
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate portal client
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          if [ -f pnpm-lock.yaml ]; then PM="pnpm"; elif [ -f yarn.lock ]; then PM="yarn"; else PM="npm"; fi
          for script in typecheck lint build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then
              $PM run "$script" || status=$?
            fi
          done
          if [ "$PM" = "pnpm" ]; then
            pnpm exec vitest run packages/api-client/src/portals.test.ts || status=$?
          elif [ "$PM" = "yarn" ]; then
            yarn vitest run packages/api-client/src/portals.test.ts || status=$?
          else
            npx vitest run packages/api-client/src/portals.test.ts || status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record and commit result
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          mkdir -p docs/evidence
          node - <<'NODE'
          const fs = require('fs')
          const code = Number(process.env.VALIDATION_STATUS || '1')
          const payload = {
            work_package: 'feature/portal-api-client',
            status: code === 0 ? 'PASS' : 'FAIL',
            validation_exit_code: code,
            typecheck_lint_build: 'EXECUTED_WHEN_CONFIGURED',
            focused_vitest: 'EXECUTED',
            direct_provider_connections: false,
            live_capabilities_enabled: [],
            production_deployed: false,
            recorded_at: new Date().toISOString(),
          }
          fs.writeFileSync(
            'docs/evidence/portal-api-client-validation.json',
            JSON.stringify(payload, null, 2) + '\n',
          )
          NODE
          rm -f .github/workflows/portal-client-bootstrap-trigger.yml
          rm -f .github/workflows/portal-api-client-finalize-v2.yml
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/api-client/src/index.ts packages/api-client/src/portals.ts \
            packages/api-client/src/portals.test.ts \
            docs/evidence/portal-api-client-validation.json \
            .github/workflows/portal-client-bootstrap-trigger.yml \
            .github/workflows/portal-api-client-finalize-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(api-client): finalize typed portal contracts"
            git push origin HEAD:feature/portal-api-client
          fi

      - name: Fail if validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1

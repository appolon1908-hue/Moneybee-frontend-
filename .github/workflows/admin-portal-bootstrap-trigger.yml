name: Admin operations portal bootstrap

on:
  push:
    branches:
      - feature/admin-portal

permissions:
  contents: write

concurrency:
  group: admin-portal-bootstrap
  cancel-in-progress: false

jobs:
  validate-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-portal
          fetch-depth: 0

      - name: Register additive operations router
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/admin/src/main.ts")
          text = path.read_text()
          if "./router.portal" not in text:
              updated, count = re.subn(
                  r"(?P<prefix>from\s+['\"])\./router(?P<suffix>['\"])",
                  r"\g<prefix>./router.portal\g<suffix>",
                  text,
                  count=1,
              )
              if count == 0:
                  updated, count = re.subn(
                      r"(?P<prefix>import\s+['\"])\./router(?P<suffix>['\"])",
                      r"\g<prefix>./router.portal\g<suffix>",
                      text,
                      count=1,
                  )
              if count == 0:
                  raise SystemExit("Could not locate the admin router import")
              path.write_text(updated)
          PY

      - name: Patch template type helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          lender = Path("apps/lender/src/views/PortalWorkspaceView.vue")
          lender_text = lender.read_text()
          if "const selectedSubmission = computed" not in lender_text:
              marker = "const offers = computed(() => workspace.value?.offers ?? [])\n"
              addition = '''const selectedSubmission = computed<Record<string, unknown>>(() =>
  ((submissionWorkspace.value?.submission as Record<string, unknown> | undefined) ?? {}),
)
const submissionStatusCounts = computed<Record<string, number>>(() =>
  ((portfolio.value.submission_status_counts as Record<string, number> | undefined) ?? {}),
)
'''
              if marker not in lender_text:
                  raise SystemExit("Could not locate lender computed marker")
              lender_text = lender_text.replace(marker, marker + addition, 1)
          lender_text = lender_text.replace(
              "text((submissionWorkspace?.submission as Record<string, unknown>) || {}, 'status', 'Pending')",
              "text(selectedSubmission, 'status', 'Pending')",
          )
          lender_text = lender_text.replace(
              "formatDate((submissionWorkspace?.submission as Record<string, unknown>)?.submitted_at)",
              "formatDate(selectedSubmission.submitted_at)",
          )
          lender_text = lender_text.replace(
              "(portfolio.submission_status_counts as Record<string, number>) || {}",
              "submissionStatusCounts",
          )
          lender.write_text(lender_text)

          admin = Path("apps/admin/src/views/OperationsPortalView.vue")
          admin_text = admin.read_text()
          if "function nestedRecord(" not in admin_text:
              marker = "function value(record: Record<string, unknown>, key: string, fallback = '—'): string {\n"
              helper = '''function nestedRecord(
  record: Record<string, unknown>,
  key: string,
): Record<string, unknown> {
  const candidate = record[key]
  if (candidate && typeof candidate === 'object' && !Array.isArray(candidate)) {
    return candidate as Record<string, unknown>
  }
  return {}
}

'''
              if marker not in admin_text:
                  raise SystemExit("Could not locate admin helper marker")
              admin_text = admin_text.replace(marker, helper + marker, 1)
          admin_text = admin_text.replace(
              "value(entry.user as Record<string, unknown>, 'display_name', 'MoneyBee user')",
              "value(nestedRecord(entry, 'user'), 'display_name', 'MoneyBee user')",
          )
          admin_text = admin_text.replace(
              "value(entry.membership as Record<string, unknown>, 'membership_type')",
              "value(nestedRecord(entry, 'membership'), 'membership_type')",
          )
          admin_text = admin_text.replace(
              "value(entry.membership as Record<string, unknown>, 'active') === 'true'",
              "value(nestedRecord(entry, 'membership'), 'active') === 'true'",
          )
          admin.write_text(admin_text)

          borrower = Path("apps/borrower/src/views/PortalWorkspaceView.vue")
          borrower_text = borrower.read_text()
          old = """    const session = await portalApi.createUploadSession(
      selectedApplicationId.value,
      {
        original_file_name: file.name,
        mime_type: file.type || 'application/octet-stream',
"""
          new = """    if (!file.type) {
      throw new Error('This file does not report a supported media type.')
    }
    const session = await portalApi.createUploadSession(
      selectedApplicationId.value,
      {
        original_file_name: file.name,
        mime_type: file.type,
"""
          if old in borrower_text:
              borrower_text = borrower_text.replace(old, new, 1)
          borrower.write_text(borrower_text)
          PY

      - name: Install workspace
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate available workspace scripts
        id: validate
        shell: bash
        run: |
          set +e
          if [ -f pnpm-lock.yaml ]; then PM="pnpm"; elif [ -f yarn.lock ]; then PM="yarn"; else PM="npm"; fi
          status=0
          for script in typecheck lint test build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then
              if [ "$script" = "test" ]; then
                $PM run "$script" -- --run || status=$?
              else
                $PM run "$script" || status=$?
              fi
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit registration and validated fixes
        run: |
          rm -f .github/workflows/admin-portal-bootstrap-trigger.yml
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/admin/src/main.ts \
            apps/admin/src/views/OperationsPortalView.vue \
            apps/lender/src/views/PortalWorkspaceView.vue \
            apps/borrower/src/views/PortalWorkspaceView.vue \
            .github/workflows/admin-portal-bootstrap-trigger.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat(admin): register and validate portal stack"
            git push origin HEAD:feature/admin-portal
          fi

      - name: Fail when validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1

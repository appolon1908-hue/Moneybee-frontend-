name: Portal API client bootstrap

on:
  push:
    branches:
      - feature/portal-api-client

permissions:
  contents: write

concurrency:
  group: portal-client-bootstrap
  cancel-in-progress: false

jobs:
  validate-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portal-api-client
          fetch-depth: 0

      - name: Export the portal API module
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/api-client/src/index.ts")
          text = path.read_text()
          export = "export * from './portals'"
          if export not in text:
              text = text.rstrip() + "\n" + export + "\n"
              path.write_text(text)
          PY

      - name: Install workspace
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate available workspace scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then PM="pnpm"; elif [ -f yarn.lock ]; then PM="yarn"; else PM="npm"; fi
          for script in typecheck lint test build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then
              if [ "$script" = "test" ]; then
                $PM run "$script" -- --run
              else
                $PM run "$script"
              fi
            fi
          done

      - name: Commit validated export
        run: |
          rm -f .github/workflows/portal-client-bootstrap-trigger.yml
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          git add packages/api-client/src/index.ts .github/workflows/portal-client-bootstrap-trigger.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat(api-client): export validated portal clients"
            git push origin HEAD:feature/portal-api-client
          fi

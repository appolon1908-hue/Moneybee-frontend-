name: release-frontend-images

on:
  push:
    branches:
      - "release/staging"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact release/staging commit SHA; defaults to the selected branch head
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: moneybee-frontend-staging-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/staging'
    environment: staging-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      NODE_BASE_IMAGE: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      NGINX_BASE_IMAGE: nginx:alpine@sha256:a9ae6f6d078d477e21323310498e5196cb2b7c0aedd9e07b7306612077227d7c
      GOOGLE_LOGIN_ENABLED: "false"
      GOOGLE_IDP_ALIAS: google
    strategy:
      fail-fast: false
      matrix:
        app: [marketing, borrower, lender, admin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify protected source and digest-pinned base images
        env:
          SOURCE_SHA: ${{ env.RELEASE_SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/staging"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin release/staging:refs/remotes/origin/release/staging
          test "$SOURCE_SHA" = "$(git rev-parse refs/remotes/origin/release/staging)"
          [[ "$NODE_BASE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$NGINX_BASE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$GOOGLE_LOGIN_ENABLED" =~ ^(true|false)$ ]]
          if [[ "$GOOGLE_LOGIN_ENABLED" == true ]]; then
            test -n "$GOOGLE_IDP_ALIAS"
          fi

      - name: Resolve reviewed portal client ID
        id: client
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          case "$APP" in
            marketing) value="" ;;
            borrower) value="moneybee-borrower" ;;
            lender) value="moneybee-lender" ;;
            admin) value="moneybee-admin" ;;
            *) echo "Unknown app: $APP" >&2; exit 1 ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - id: build_date
        name: Record build timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}
          tags: type=sha,format=long,prefix=sha-

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
            NGINX_BASE_IMAGE=${{ env.NGINX_BASE_IMAGE }}
            SOURCE_SHA=${{ env.RELEASE_SOURCE_SHA }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
            VITE_API_BASE_URL=https://api-staging.moneybeeloan.com/api/v2
            VITE_BORROWER_URL=https://app-staging.moneybeeloan.com
            VITE_LENDER_URL=https://lenders-staging.moneybeeloan.com
            VITE_ADMIN_URL=https://admin-staging.moneybeeloan.com
            VITE_OIDC_AUTHORITY=https://auth.codestra.co/realms/codestra
            VITE_OIDC_CLIENT_ID=${{ steps.client.outputs.value }}
            VITE_OIDC_AUDIENCE=moneybee-api
            VITE_GOOGLE_LOGIN_ENABLED=${{ env.GOOGLE_LOGIN_ENABLED }}
            VITE_GOOGLE_IDP_ALIAS=${{ env.GOOGLE_IDP_ALIAS }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=frontend-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.app }}

      - name: Enforce runtime vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Export runtime CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: evidence/sbom.cdx.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Record reviewed configuration checksums
        id: checksums
        env:
          APP: ${{ matrix.app }}
          CLIENT_ID: ${{ steps.client.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          config_files=(
            Dockerfile
            nginx.conf
            nginx-main.conf
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            deploy/compose.frontend.yml
            deploy/OIDC_CLIENTS.md
          )
          : >evidence/configuration-files.sha256
          for file in "${config_files[@]}"; do
            test -f "$file"
            sha256sum "$file" >>evidence/configuration-files.sha256
          done
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          names = (
              "APP",
              "CLIENT_ID",
              "NODE_BASE_IMAGE",
              "NGINX_BASE_IMAGE",
              "GOOGLE_LOGIN_ENABLED",
              "GOOGLE_IDP_ALIAS",
          )
          lines = []
          for name in names:
              digest = hashlib.sha256(os.environ.get(name, "").encode()).hexdigest()
              lines.append(f"{name} sha256:{digest}")
          Path("evidence/configuration-values.sha256").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          cat evidence/configuration-files.sha256 evidence/configuration-values.sha256 \
            >evidence/configuration.inputs.sha256
          aggregate="$(sha256sum evidence/configuration.inputs.sha256 | awk '{print $1}')"
          sbom_digest="$(sha256sum evidence/sbom.cdx.json | awk '{print $1}')"
          printf '%s\n' "$aggregate" >evidence/configuration.aggregate.sha256
          printf '%s\n' "$sbom_digest" >evidence/sbom.cdx.json.sha256
          echo "configuration_checksum=$aggregate" >>"$GITHUB_OUTPUT"
          echo "sbom_checksum=$sbom_digest" >>"$GITHUB_OUTPUT"

      - name: Generate signed build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate signed SBOM attestation
        id: sbom_attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: evidence/sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign immutable image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Verify keyless image signature
        env:
          IMAGE_DIGEST: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}@${{ steps.build.outputs.digest }}
        run: >-
          cosign verify "$IMAGE_DIGEST"
          --certificate-identity "https://github.com/appolon1908-hue/Moneybee-frontend-/.github/workflows/release-frontend-images.yml@refs/heads/release/staging"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          --output-json > evidence/cosign-verification.json

      - name: Preserve and verify signed attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" evidence/provenance.bundle.json
          cp "${{ steps.sbom_attestation.outputs.bundle-path }}" evidence/sbom.bundle.json
          gh attestation verify "oci://$IMAGE_DIGEST" \
            -R "$GITHUB_REPOSITORY" --format json \
            >evidence/provenance-verification.json
          gh attestation verify "oci://$IMAGE_DIGEST" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type "https://cyclonedx.org/bom" \
            --format json \
            >evidence/sbom-attestation-verification.json

      - name: Record immutable release evidence
        env:
          APP: ${{ matrix.app }}
          IMAGE: ghcr.io/appolon1908-hue/moneybee-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ env.RELEASE_SOURCE_SHA }}
          CONFIGURATION_CHECKSUM: ${{ steps.checksums.outputs.configuration_checksum }}
          SBOM_CHECKSUM: ${{ steps.checksums.outputs.sbom_checksum }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ATTESTATION_ID: ${{ steps.sbom_attestation.outputs.attestation-id }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom_attestation.outputs.attestation-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          evidence = {
              "schema_version": 2,
              "status": "PUBLISHED_SIGNED_ATTESTED_VERIFIED",
              "application": os.environ["APP"],
              "image": os.environ["IMAGE"],
              "digest": os.environ["DIGEST"],
              "immutable_identity": os.environ["IMAGE"] + "@" + os.environ["DIGEST"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "created_at": datetime.now(UTC).isoformat(),
              "configuration_checksum": os.environ["CONFIGURATION_CHECKSUM"],
              "sbom_sha256": os.environ["SBOM_CHECKSUM"],
              "provenance": {
                  "attestation_id": os.environ["PROVENANCE_ID"],
                  "attestation_url": os.environ["PROVENANCE_URL"],
                  "verified": True,
              },
              "sbom_attestation": {
                  "attestation_id": os.environ["SBOM_ATTESTATION_ID"],
                  "attestation_url": os.environ["SBOM_ATTESTATION_URL"],
                  "verified": True,
              },
              "signature": {
                  "mechanism": "sigstore-cosign-github-oidc",
                  "verified": True,
              },
              "production_authorized": False,
              "external_effects_enabled": False,
          }
          Path("evidence/release.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
          (
            cd evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
              sort |
              xargs sha256sum >SHA256SUMS
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ matrix.app }}-release-${{ env.RELEASE_SOURCE_SHA }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

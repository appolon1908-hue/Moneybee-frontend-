name: canonicalize-compliance-ui

on:
  push:
    branches:
      - feature/clear-compliance-operations-ui-20260901
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonicalize-compliance-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    if: github.repository == 'appolon1908-hue/Moneybee-frontend-'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Allow deterministic apply workflows to finish
        run: sleep 720
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/clear-compliance-operations-ui-20260901
          fetch-depth: 0
      - name: Checkout backend contract authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: appolon1908-hue/Moneybee-Backend
          ref: claude/system-review-architecture-8vo66p
          path: moneybee-backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: moneybee-backend/pyproject.toml
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Assert deterministic UI source exists
        run: |
          test -f packages/api-client/src/compliance.ts
          test -f apps/admin/src/views/ComplianceView.vue
          test -f scripts/apply_compliance_ui_completion.py
      - name: Canonicalize ENDPOINTS.compliance to one object
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          path = Path('packages/api-client/src/endpoints.ts')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^\s*compliance:\s*\{')
          spans = []
          for match in pattern.finditer(source):
              opening = source.find('{', match.start())
              depth = 0
              quote = None
              escaped = False
              index = opening
              while index < len(source):
                  char = source[index]
                  if escaped:
                      escaped = False
                  elif char == '\\':
                      escaped = True
                  elif quote:
                      if char == quote:
                          quote = None
                  elif char in {'"', "'", '`'}:
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          while end < len(source) and source[end] in ' \t':
                              end += 1
                          if end < len(source) and source[end] == ',':
                              end += 1
                          if end < len(source) and source[end] == '\n':
                              end += 1
                          spans.append((match.start(), end))
                          break
                  index += 1

          for start, end in reversed(spans):
              source = source[:start] + source[end:]

          marker = 'export const ENDPOINTS = {\n'
          if marker not in source:
              raise SystemExit('ENDPOINTS declaration not found')
          block = '''  compliance: {
            summary: "/admin/compliance/summary",
            adverseActionNotices: "/admin/compliance/adverse-action-notices",
            commercialFinancingDisclosures:
              "/admin/compliance/commercial-financing-disclosures",
            commissionTaxRecords: "/admin/compliance/commission-tax-records",
            commercialFinancingDisclosure: (offerId: string) =>
              `/admin/offers/${encodeURIComponent(offerId)}/commercial-financing-disclosure`,
            acknowledgeCommercialFinancingDisclosure: (offerId: string) =>
              `/admin/offers/${encodeURIComponent(offerId)}/commercial-financing-disclosure/acknowledge`,
            generateCommissionTaxRecords: "/admin/commission-tax-records/generate",
            commissionTaxRecordTin: (recordId: string) =>
              `/admin/commission-tax-records/${encodeURIComponent(recordId)}/tin`,
            applicationAdverseActionNotices: (applicationId: string) =>
              `/admin/applications/${encodeURIComponent(applicationId)}/adverse-action-notices`,
          },
          '''
          source = source.replace(marker, marker + block, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Export exact backend OpenAPI
        working-directory: moneybee-backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./canonical-contract.db
          AUTO_CREATE_SCHEMA: "true"
          LOCAL_AUTH_BYPASS: "true"
          LOCAL_IDENTITY_ENFORCEMENT: "false"
          FIELD_ENCRYPTION_KEYS_JSON: '{"1":"zJ8vQ3mK7pR2sT5wX9aB1cD4eF6gH0iJ2kL4mN6oP8q="}'
          FIELD_ENCRYPTION_ACTIVE_KEY_VERSION: "1"
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python scripts/export_openapi.py
          python scripts/verify_openapi_contract.py
      - name: Install and validate frontend
        env:
          MONEYBEE_OPENAPI_FILE: ${{ github.workspace }}/moneybee-backend/openapi.json
        run: |
          pnpm install --frozen-lockfile
          if pnpm exec prettier --version >/dev/null 2>&1; then
            pnpm exec prettier --write packages/api-client/src/endpoints.ts
          fi
          pnpm contracts:check
          pnpm typecheck
          pnpm test
          pnpm build
          python scripts/validate_frontend_scaffold.py
      - name: Refresh exact backend lock and commit
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path = Path('docs/BACKEND_CONTRACT_LOCK.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['sha'] = subprocess.check_output(
              ['git', '-C', 'moneybee-backend', 'rev-parse', 'HEAD'], text=True
          ).strip()
          payload['openapi_sha256'] = hashlib.sha256(
              Path('moneybee-backend/openapi.json').read_bytes()
          ).hexdigest()
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/api-client/src/endpoints.ts docs/BACKEND_CONTRACT_LOCK.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(api-client): canonicalize compliance endpoint contract"
            git push origin HEAD:feature/clear-compliance-operations-ui-20260901
          fi

name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Preserve bootstrap lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build marketing image
        run: docker build --build-arg APP=marketing -t moneybee-marketing:${GITHUB_SHA} .
      - name: Build borrower image
        run: docker build --build-arg APP=borrower -t moneybee-borrower:${GITHUB_SHA} .
      - name: Build lender image
        run: docker build --build-arg APP=lender -t moneybee-lender:${GITHUB_SHA} .
      - name: Build admin image
        run: docker build --build-arg APP=admin -t moneybee-admin:${GITHUB_SHA} .

name: secure-frontend-ci

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "ops/**"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: secure-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout MoneyBee backend contract source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: appolon1908-hue/Moneybee-Backend
          ref: ${{ vars.MONEYBEE_BACKEND_CONTRACT_REF || 'release/moneybee-repository-complete-20260902' }}
          path: moneybee-backend
      - name: Record exact backend contract head
        working-directory: moneybee-backend
        run: git rev-parse HEAD | tee ../moneybee-backend-contract-sha.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Export backend OpenAPI contract
        working-directory: moneybee-backend
        env:
          APP_ENV: test
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: sqlite+aiosqlite:///./contract-export.db
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          python scripts/export_openapi.py
      - name: Frozen install and application validation
        env:
          MONEYBEE_OPENAPI_FILE: ${{ github.workspace }}/moneybee-backend/openapi.json
        run: |
          pnpm install --frozen-lockfile
          pnpm contracts:check
          pnpm typecheck
          pnpm test
          pnpm build
          python scripts/validate_frontend_scaffold.py
      - name: Upload exact contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moneybee-frontend-contract-${{ github.run_id }}
          path: |
            moneybee-backend-contract-sha.txt
            moneybee-backend/openapi.json
          if-no-files-found: error
          retention-days: 14

  containers:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [marketing, borrower, lender, admin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: moneybee-${{ matrix.app }}:ci
          build-args: |
            APP=${{ matrix.app }}
            SOURCE_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}
            VITE_API_BASE_URL=https://api-staging.moneybeeloan.com/api/v2
            VITE_BORROWER_URL=https://app-staging.moneybeeloan.com
            VITE_LENDER_URL=https://lenders-staging.moneybeeloan.com
            VITE_ADMIN_URL=https://admin-staging.moneybeeloan.com
            VITE_OIDC_AUTHORITY=https://auth.codestra.co/realms/codestra
            VITE_OIDC_CLIENT_ID=ci-${{ matrix.app }}
            VITE_OIDC_AUDIENCE=moneybee-api
            VITE_GOOGLE_LOGIN_ENABLED=false
          cache-from: type=gha,scope=frontend-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.app }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: moneybee-${{ matrix.app }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

name: frontend-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve bootstrap lock
        run: pnpm install --no-frozen-lockfile
      - name: Commit resolved lockfile to bootstrap branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bootstrap/frontend-foundation'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore: commit resolved pnpm lockfile'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Prove frozen reinstall
        run: pnpm install --frozen-lockfile
      - name: Preserve resolved lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build all frontend containers
        run: |
          for app in marketing borrower lender admin; do
            docker build --build-arg APP=$app -t moneybee-$app:${{ github.sha }} .
          done
      - name: Guard live capabilities
        run: |
          grep -q '^VITE_CREDIT_LIVE_PULL=false' .env.example
          grep -q '^VITE_LENDERS_LIVE_SUBMISSION=false' .env.example
          grep -q '^VITE_ESIGN_LIVE_SEND=false' .env.example
          grep -q '^VITE_FUNDING_LIVE_CONFIRMATION=false' .env.example
          grep -q '^VITE_PAYMENTS=false' .env.example
          grep -q '^VITE_PAYOUTS=false' .env.example

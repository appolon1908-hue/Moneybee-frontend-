name: frontend-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure deprecated identity host is absent
        run: node -e "const fs=require('fs'),path=require('path'),needle='auth.codestra.'+'agency'; function walk(d){for(const n of fs.readdirSync(d)){const p=path.join(d,n);if(p.includes('.git'))continue;const s=fs.statSync(p);if(s.isDirectory())walk(p);else if(fs.readFileSync(p,'utf8').includes(needle))process.exit(1)}} walk('.')"

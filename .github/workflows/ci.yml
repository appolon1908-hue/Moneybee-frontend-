name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducibly
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Commit bootstrap lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml || [ -n "$(git ls-files --others --exclude-standard pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: commit reproducible pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build marketing image
        run: docker build --build-arg APP=marketing -t moneybee-marketing:${GITHUB_SHA} .

      - name: Build borrower image
        run: docker build --build-arg APP=borrower -t moneybee-borrower:${GITHUB_SHA} .

      - name: Build lender image
        run: docker build --build-arg APP=lender -t moneybee-lender:${GITHUB_SHA} .

      - name: Build admin image
        run: docker build --build-arg APP=admin -t moneybee-admin:${GITHUB_SHA} .

name: Admin operations portal hardening v3

on:
  push:
    branches:
      - feature/admin-portal

permissions:
  contents: write

concurrency:
  group: admin-portal-hardening-v3
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-portal
          fetch-depth: 0

      - name: Wait for hardened lender portal and merge it
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          ready=0
          for attempt in $(seq 1 80); do
            git fetch origin feature/lender-portal
            if git show origin/feature/lender-portal:docs/evidence/lender-portal-validation-v3.json > /tmp/lender-v3.json 2>/dev/null; then
              if [ "$(jq -r '.status // ""' /tmp/lender-v3.json)" = "PASS" ]; then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "Hardened lender portal was not available" >&2
            exit 1
          fi
          git merge -X theirs --no-edit origin/feature/lender-portal

      - name: Normalize remaining admin template access
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/admin/src/views/OperationsPortalView.vue")
          text = path.read_text()
          text = text.replace(
              "formatDate(event.created_at || event.occurred_at)",
              "formatDate(event['created_at'] || event['occurred_at'])",
          )
          path.write_text(text)
          PY

      - name: Install and validate complete frontend stack
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile || status=$?
            PM="pnpm"
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || status=$?
            PM="yarn"
          elif [ -f package-lock.json ]; then
            npm ci || status=$?
            PM="npm"
          else
            npm install || status=$?
            PM="npm"
          fi
          for script in typecheck lint test build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then
              if [ "$script" = "test" ]; then
                $PM run "$script" -- --run || status=$?
              else
                $PM run "$script" || status=$?
              fi
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record and publish hardened frontend result
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          mkdir -p docs/evidence
          node - <<'NODE'
          const fs = require('fs')
          const code = Number(process.env.VALIDATION_STATUS || '1')
          fs.writeFileSync(
            'docs/evidence/admin-portal-validation-v3.json',
            JSON.stringify(
              {
                work_package: 'feature/admin-portal',
                revision: 3,
                status: code === 0 ? 'PASS' : 'FAIL',
                validation_exit_code: code,
                base_validation: 'lender-portal-v3=PASS',
                typecheck_lint_test_build: 'EXECUTED_WHEN_CONFIGURED',
                webhook_payload_default: 'HIDDEN',
                authorization_authority: 'BACKEND',
                live_capabilities_enabled: [],
                production_deployed: false,
                recorded_at: new Date().toISOString(),
              },
              null,
              2,
            ) + '\n',
          )
          NODE
          rm -f .github/workflows/admin-portal-bootstrap-trigger.yml
          rm -f .github/workflows/admin-portal-finalize-v2.yml
          rm -f .github/workflows/admin-portal-hardening-v3.yml
          git add \
            apps/admin/src/views/OperationsPortalView.vue \
            docs/evidence/admin-portal-validation-v3.json \
            .github/workflows/admin-portal-bootstrap-trigger.yml \
            .github/workflows/admin-portal-finalize-v2.yml \
            .github/workflows/admin-portal-hardening-v3.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(admin): validate hardened frontend stack"
          fi
          git fetch origin feature/admin-portal
          if ! git merge-base --is-ancestor origin/feature/admin-portal HEAD; then
            git rebase origin/feature/admin-portal
          fi
          git push origin HEAD:feature/admin-portal

      - name: Fail if validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1

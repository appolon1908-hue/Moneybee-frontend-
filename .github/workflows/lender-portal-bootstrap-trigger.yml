name: Lender portal bootstrap

on:
  push:
    branches:
      - feature/lender-portal

permissions:
  contents: write

concurrency:
  group: lender-portal-bootstrap
  cancel-in-progress: false

jobs:
  validate-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lender-portal
          fetch-depth: 0

      - name: Register additive portal router
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/lender/src/main.ts")
          text = path.read_text()
          if "./router.portal" not in text:
              updated, count = re.subn(
                  r"(?P<prefix>from\s+['\"])\./router(?P<suffix>['\"])",
                  r"\g<prefix>./router.portal\g<suffix>",
                  text,
                  count=1,
              )
              if count == 0:
                  updated, count = re.subn(
                      r"(?P<prefix>import\s+['\"])\./router(?P<suffix>['\"])",
                      r"\g<prefix>./router.portal\g<suffix>",
                      text,
                      count=1,
                  )
              if count == 0:
                  raise SystemExit("Could not locate the lender router import")
              path.write_text(updated)
          PY

      - name: Install workspace
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate available workspace scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then PM="pnpm"; elif [ -f yarn.lock ]; then PM="yarn"; else PM="npm"; fi
          for script in typecheck lint test build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then
              if [ "$script" = "test" ]; then
                $PM run "$script" -- --run
              else
                $PM run "$script"
              fi
            fi
          done

      - name: Commit validated registration
        run: |
          rm -f .github/workflows/lender-portal-bootstrap-trigger.yml
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/lender/src/main.ts .github/workflows/lender-portal-bootstrap-trigger.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat(lender): register validated portal workspace"
            git push origin HEAD:feature/lender-portal
          fi

name: Portal stack CI

on:
  push:
    branches:
      - "release/portal-stack-consolidated"
      - "feature/business-lender-site-forms"
  pull_request:
    branches:
      - "frontend/keycloak-pkce"
      - "release/portal-stack-consolidated"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build all portals
        run: pnpm build
      - name: Build marketing image
        run: docker build --build-arg APP=marketing -t moneybee-marketing:test .
      - name: Build borrower image
        run: docker build --build-arg APP=borrower -t moneybee-borrower:test .
      - name: Build lender image
        run: docker build --build-arg APP=lender -t moneybee-lender:test .
      - name: Build admin image
        run: docker build --build-arg APP=admin -t moneybee-admin:test .

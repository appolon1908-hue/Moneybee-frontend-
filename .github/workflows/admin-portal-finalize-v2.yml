name: Admin operations portal finalization v2

on:
  push:
    branches:
      - feature/admin-portal

permissions:
  contents: write

concurrency:
  group: admin-portal-finalization-v2
  cancel-in-progress: false

jobs:
  synchronize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-portal
          fetch-depth: 0

      - name: Wait for and merge validated lender portal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          ready=0
          for attempt in $(seq 1 80); do
            git fetch origin feature/lender-portal
            if git show origin/feature/lender-portal:docs/evidence/lender-portal-validation.json > /tmp/lender.json 2>/dev/null; then
              if [ "$(jq -r '.status // ""' /tmp/lender.json)" = "PASS" ]; then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "Validated lender portal was not available" >&2
            exit 1
          fi
          git merge -X theirs --no-edit origin/feature/lender-portal

      - name: Register and correct operations workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path("apps/admin/src/main.ts")
          text = main.read_text()
          if "./router.portal" not in text:
              updated, count = re.subn(
                  r"(?P<prefix>from\s+['\"])\./router(?P<suffix>['\"])",
                  r"\g<prefix>./router.portal\g<suffix>",
                  text,
                  count=1,
              )
              if count == 0:
                  updated, count = re.subn(
                      r"(?P<prefix>import\s+['\"])\./router(?P<suffix>['\"])",
                      r"\g<prefix>./router.portal\g<suffix>",
                      text,
                      count=1,
                  )
              if count == 0:
                  raise SystemExit("Admin router import marker not found")
              main.write_text(updated)

          view = Path("apps/admin/src/views/OperationsPortalView.vue")
          text = view.read_text()
          marker = "function value(record: Record<string, unknown>, key: string, fallback = '—'): string {\n"
          if "function nestedRecord(" not in text:
              helper = '''function nestedRecord(
  record: Record<string, unknown>,
  key: string,
): Record<string, unknown> {
  const candidate = record[key]
  if (candidate && typeof candidate === 'object' && !Array.isArray(candidate)) {
    return candidate as Record<string, unknown>
  }
  return {}
}

'''
              if marker not in text:
                  raise SystemExit("Admin helper marker not found")
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "value(entry.user as Record<string, unknown>, 'display_name', 'MoneyBee user')",
              "value(nestedRecord(entry, 'user'), 'display_name', 'MoneyBee user')",
          )
          text = text.replace(
              "value(entry.membership as Record<string, unknown>, 'membership_type')",
              "value(nestedRecord(entry, 'membership'), 'membership_type')",
          )
          text = text.replace(
              "value(entry.membership as Record<string, unknown>, 'active') === 'true'",
              "value(nestedRecord(entry, 'membership'), 'active') === 'true'",
          )
          view.write_text(text)
          PY

      - name: Install workspace
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate complete frontend stack
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          if [ -f pnpm-lock.yaml ]; then PM="pnpm"; elif [ -f yarn.lock ]; then PM="yarn"; else PM="npm"; fi
          for script in typecheck lint test build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then
              if [ "$script" = "test" ]; then
                $PM run "$script" -- --run || status=$?
              else
                $PM run "$script" || status=$?
              fi
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record and publish final frontend branch result
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          mkdir -p docs/evidence
          node - <<'NODE'
          const fs = require('fs')
          const code = Number(process.env.VALIDATION_STATUS || '1')
          fs.writeFileSync(
            'docs/evidence/admin-portal-validation.json',
            JSON.stringify(
              {
                work_package: 'feature/admin-portal',
                status: code === 0 ? 'PASS' : 'FAIL',
                validation_exit_code: code,
                base_validation: 'lender-portal=PASS',
                typecheck_lint_test_build: 'EXECUTED_WHEN_CONFIGURED',
                webhook_payload_default: 'HIDDEN',
                authorization_authority: 'BACKEND',
                live_capabilities_enabled: [],
                production_deployed: false,
                recorded_at: new Date().toISOString(),
              },
              null,
              2,
            ) + '\n',
          )
          NODE
          rm -f .github/workflows/admin-portal-bootstrap-trigger.yml
          rm -f .github/workflows/admin-portal-finalize-v2.yml
          git add \
            apps/admin/src/main.ts apps/admin/src/views/OperationsPortalView.vue \
            docs/evidence/admin-portal-validation.json \
            .github/workflows/admin-portal-bootstrap-trigger.yml \
            .github/workflows/admin-portal-finalize-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(admin): synchronize and validate operations portal"
          fi
          git fetch origin feature/admin-portal
          if ! git merge-base --is-ancestor origin/feature/admin-portal HEAD; then
            git rebase origin/feature/admin-portal
          fi
          git push origin HEAD:feature/admin-portal

      - name: Fail if validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1

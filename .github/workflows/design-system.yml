name: MoneyBee Frontend Quality Gate

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/check-design-system.mjs'
      - 'docs/DESIGN_SYSTEM.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/design-system.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/check-design-system.mjs'
      - 'docs/DESIGN_SYSTEM.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Enforce MoneyBee design system
        run: pnpm test:design

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

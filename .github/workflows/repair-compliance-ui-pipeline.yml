name: repair-compliance-ui-pipeline

on:
  push:
    branches:
      - feature/clear-compliance-operations-ui-20260901
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: repair-compliance-ui-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-run:
    if: github.repository == 'appolon1908-hue/Moneybee-frontend-'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/clear-compliance-operations-ui-20260901
          fetch-depth: 0
      - name: Correct the generated TypeScript and money presentation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/complete-compliance-ui.yml')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'function queryString(values: Record<string, unknown>): string {',
              'function queryString<T extends object>(values: T): string {',
          )
          source = source.replace(
              'for (const [key, value] of Object.entries(values)) {',
              'for (const [key, value] of Object.entries(values as Record<string, unknown>)) {',
          )

          # Preserve cents for compliance values rather than using the global
          # rounded-dollar dashboard helper.
          source = source.replace('                money,\n', '')
          source = source.replace(
              '''              function formatApr(value: string | null): string {
                              return value === null ? "Not available" : `${Number(value).toFixed(2)}%`;
                            }
              ''',
              '''              function formatMoney(value: string): string {
                              return new Intl.NumberFormat("en-US", {
                                style: "currency",
                                currency: "USD",
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2,
                              }).format(Number(value));
                            }

                            function formatApr(value: string | null): string {
                              return value === null ? "Not available" : `${Number(value).toFixed(2)}%`;
                            }
              ''',
          )
          source = source.replace('money(item.amount_financed)', 'formatMoney(item.amount_financed)')
          source = source.replace('money(item.finance_charge)', 'formatMoney(item.finance_charge)')
          source = source.replace('money(item.total_amount)', 'formatMoney(item.total_amount)')

          # Make the optional formatting step fail-open while all authoritative
          # type/test/build checks remain fail-closed.
          pattern = re.compile(
              r'^      - name: Format implementation\n'
              r'        run: \|\n'
              r'(?P<body>(?:^          .*\n)+?)'
              r'(?=^      - name: Validate frontend implementation\n)',
              re.MULTILINE,
          )
          match = pattern.search(source)
          if match:
              body = match.group('body')
              commands = ''.join(
                  ('  ' + line if line.strip() else line)
                  for line in body.splitlines(keepends=True)
              )
              replacement = (
                  '      - name: Format implementation when Prettier is available\n'
                  '        run: |\n'
                  '          if pnpm exec prettier --version >/dev/null 2>&1; then\n'
                  f'{commands}'
                  '          else\n'
                  '            echo "Prettier is not part of this repository toolchain; continuing to authoritative validation."\n'
                  '          fi\n'
              )
              source = source[:match.start()] + replacement + source[match.end():]
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit repaired generator
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/complete-compliance-ui.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: generate strict typed compliance client"
            git push origin HEAD:feature/clear-compliance-operations-ui-20260901
          fi
      - name: Wait for competing branch jobs to settle
        run: sleep 90
      - name: Dispatch corrected implementation and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run complete-compliance-ui.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref feature/clear-compliance-operations-ui-20260901
          run_id=""
          for _ in $(seq 1 36); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow complete-compliance-ui.yml \
              --branch feature/clear-compliance-operations-ui-20260901 \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt,status \
              --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" \
              | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

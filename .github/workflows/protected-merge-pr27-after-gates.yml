name: protected-merge-pr27-after-gates

on:
  push:
    branches:
      - release/moneybee-frontend-repository-complete-20260902
    paths:
      - .github/workflows/protected-merge-pr27-after-gates.yml

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge-after-protected-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "27"
      REVIEWER: kazan555
      OLD_BACKEND_SHA: bb5e00016be80c036500fb8cb382b3c47fd88c9b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/moneybee-frontend-repository-complete-20260902
          fetch-depth: 1
      - name: Remove one-shot merge workflow from candidate source
        run: |
          set -euo pipefail
          git rm .github/workflows/protected-merge-pr27-after-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove one-shot frontend merge workflow"
          git push origin HEAD:release/moneybee-frontend-repository-complete-20260902
      - name: Request fresh exact-head review
        run: |
          gh pr ready "$PR_NUMBER" || true
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=${REVIEWER}" || true
      - name: Wait for protected contract lock, gates, and merge
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          last_status="not evaluated"
          for attempt in $(seq 1 200); do
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            if test "$(jq -r '.merged' <<<"$pr")" = "true"; then
              echo "PR already merged."
              exit 0
            fi
            head_sha="$(jq -r '.head.sha' <<<"$pr")"
            draft="$(jq -r '.draft' <<<"$pr")"

            branch_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${head_sha}?recursive=1")"
            contract_locked=false
            if ! git ls-remote https://github.com/appolon1908-hue/Moneybee-Backend.git "$OLD_BACKEND_SHA" >/dev/null 2>&1; then
              :
            fi
            workflow_file="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/secure-ci.yml?ref=${head_sha}" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)"
            if test -n "$workflow_file" && ! grep -q "$OLD_BACKEND_SHA" <<<"$workflow_file"; then
              contract_locked=true
            fi

            workflows="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100")"
            frontend="$(jq -r --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha and .name == "secure-frontend-ci")] | sort_by(.run_number) | last | (.status + ":" + (.conclusion // "")) // "missing"' <<<"$workflows")"

            review_data="$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewDecision reviewThreads(first:100){nodes{isResolved}}}}}' \
              -F owner="$owner" -F repo="$repo" -F number="${PR_NUMBER}")"
            decision="$(jq -r '.data.repository.pullRequest.reviewDecision // "NONE"' <<<"$review_data")"
            unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$review_data")"

            last_status="head=${head_sha} draft=${draft} backend_contract_locked=${contract_locked} frontend_ci=${frontend} review=${decision} unresolved=${unresolved}"
            echo "$last_status"

            if test "$draft" = "false" \
              && test "$contract_locked" = "true" \
              && test "$frontend" = "completed:success" \
              && test "$decision" = "APPROVED" \
              && test "$unresolved" = "0"; then
              result="$(gh api --method PUT \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
                -f sha="$head_sha" \
                -f merge_method=squash \
                -f commit_title='release: complete MoneyBee frontend compliance and API bindings (#27)' \
                -f commit_message='Protected merge after backend merge-SHA lock, exact-head CI, resolved review threads, and independent approval.')"
              test "$(jq -r '.merged' <<<"$result")" = "true"
              merge_sha="$(jq -r '.sha' <<<"$result")"
              gh api --method POST \
                "repos/appolon1908-hue/Moneybee-Backend/issues/44/comments" \
                -f body="Frontend PR #27 protected-merged at \`${merge_sha}\` after locking to the protected backend merge SHA, exact-head CI, zero unresolved review threads, and independent approval. No deployment, SSH change, production access, or external-effect activation occurred."
              echo "FRONTEND_PROTECTED_MERGE_SHA=${merge_sha}"
              exit 0
            fi
            sleep 15
          done

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="Protected frontend merge remains blocked after the one-shot gate wait. Last observed status: \`${last_status}\`. No protection was bypassed and no production or SSH change occurred."
          exit 1

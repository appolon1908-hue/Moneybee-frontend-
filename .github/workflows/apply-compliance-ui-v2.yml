name: apply-compliance-ui-v2

on:
  push:
    branches:
      - feature/clear-compliance-operations-ui-20260901
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-compliance-ui-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.repository == 'appolon1908-hue/Moneybee-frontend-'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Allow backend v2 apply to publish its exact contract
        run: sleep 420
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/clear-compliance-operations-ui-20260901
          fetch-depth: 0
      - name: Checkout backend contract authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: appolon1908-hue/Moneybee-Backend
          ref: claude/system-review-architecture-8vo66p
          path: moneybee-backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: moneybee-backend/pyproject.toml
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Apply repository completion script
        run: python scripts/apply_compliance_ui_completion.py
      - name: Format when repository tooling provides Prettier
        run: |
          if pnpm exec prettier --version >/dev/null 2>&1; then
            pnpm exec prettier --write \
              packages/api-client/src/compliance.ts \
              packages/api-client/src/compliance.test.ts \
              packages/api-client/src/endpoints.ts \
              packages/api-client/src/index.ts \
              apps/admin/src/App.vue \
              apps/admin/src/views/ComplianceView.vue \
              apps/admin/src/router.ts \
              packages/ui/src/styles.css \
              scripts/check-api-contracts.mjs \
              .github/workflows/ci.yml \
              docs/COMPLIANCE_OPERATIONS_UI.md \
              docs/BACKEND_CONTRACT_LOCK.json
          else
            echo "Prettier is not installed; authoritative type/test/build gates remain required."
          fi
      - name: Export exact backend OpenAPI
        working-directory: moneybee-backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./frontend-contract.db
          AUTO_CREATE_SCHEMA: "true"
          LOCAL_AUTH_BYPASS: "true"
          LOCAL_IDENTITY_ENFORCEMENT: "false"
          FIELD_ENCRYPTION_KEYS_JSON: '{"1":"zJ8vQ3mK7pR2sT5wX9aB1cD4eF6gH0iJ2kL4mN6oP8q="}'
          FIELD_ENCRYPTION_ACTIVE_KEY_VERSION: "1"
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python scripts/export_openapi.py
          python scripts/verify_openapi_contract.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract, type, test, build, and scaffold gates
        env:
          MONEYBEE_OPENAPI_FILE: ${{ github.workspace }}/moneybee-backend/openapi.json
        run: |
          pnpm contracts:check
          pnpm typecheck
          pnpm test
          pnpm build
          python scripts/validate_frontend_scaffold.py
      - name: Private-key gate
        run: |
          python - <<'PY'
          from pathlib import Path

          markers = (
              "-----BEGIN PRIVATE KEY-----",
              "-----BEGIN RSA PRIVATE KEY-----",
              "-----BEGIN OPENSSH PRIVATE KEY-----",
              "-----BEGIN EC PRIVATE KEY-----",
          )
          ignored = {".git", "node_modules", "dist", ".pnpm-store"}
          failures = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if any(marker in text for marker in markers):
                  failures.append(str(path))
          if failures:
              raise SystemExit("Private-key material found: " + ", ".join(failures))
          print("No private-key blocks found in frontend source.")
          PY
      - name: Record exact backend source and contract hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path = Path("docs/BACKEND_CONTRACT_LOCK.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["sha"] = subprocess.check_output(
              ["git", "-C", "moneybee-backend", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          payload["openapi_sha256"] = hashlib.sha256(
              Path("moneybee-backend/openapi.json").read_bytes()
          ).hexdigest()
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit validated source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/api-client/src/compliance.ts \
            packages/api-client/src/compliance.test.ts \
            packages/api-client/src/endpoints.ts \
            packages/api-client/src/index.ts \
            apps/admin/src/App.vue \
            apps/admin/src/views/ComplianceView.vue \
            apps/admin/src/router.ts \
            packages/ui/src/styles.css \
            scripts/check-api-contracts.mjs \
            scripts/apply_compliance_ui_completion.py \
            .github/workflows/ci.yml \
            docs/COMPLIANCE_OPERATIONS_UI.md \
            docs/BACKEND_CONTRACT_LOCK.json
          if git diff --cached --quiet; then
            echo "Deterministic compliance UI completion is already current."
            exit 0
          fi
          git commit -m "feat(admin): complete typed compliance operations UI"
          git push origin HEAD:feature/clear-compliance-operations-ui-20260901
